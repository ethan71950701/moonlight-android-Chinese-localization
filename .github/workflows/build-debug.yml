name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [ccr-ddfc365f-4k8n4f]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK (Android SDK is preinstalled on the runner)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Write google-services.json (optional, for remote wake)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase config written from the GOOGLE_SERVICES_JSON secret"
          elif [ -f app/google-services.json ]; then
            echo "Using app/google-services.json from the repository"
          else
            echo "No Firebase config: building without remote wake support"
          fi

      - name: Build nonRoot_game debug APK
        run: ./gradlew --no-daemon :app:assembleNonRoot_gameDebug

      - name: Run remote wake unit tests (informational)
        # Does not affect the APK. Resolving the test classpath downloads Robolectric native
        # runtimes from Maven Central, which sometimes answers 429, so a failure here is not fatal.
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testNonRoot_gameDebugUnitTest --tests 'com.limelight.remotewake.*'

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: moonlight-nonRoot-debug-apk
          path: app/build/outputs/apk/nonRoot_game/debug/*.apk
